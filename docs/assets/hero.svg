<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DBLion — the guarded AI database IDE</title>
  <desc id="desc">Project title with a guarded SQL proposal flowing through a read-only gate to a human approval step.</desc>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#1d1d2b" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a277ff"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="26" fill="#0f0f14"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="1200" height="360" rx="26" fill="none" stroke="#2a2a3d" stroke-width="1.5"/>
  <g id="title-block" transform="translate(56 44)">
    <text x="0" y="0" font-family="Consolas,'JetBrains Mono',monospace" font-size="18" letter-spacing="3" fill="#9a9ab4">GUARDED AI &#183; MULTI-ENGINE IDE</text>
    <text x="0" y="78" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="72" font-weight="700" letter-spacing="-2" fill="#e6e6f0">DB<tspan fill="#a277ff">Lion</tspan></text>
    <text x="0" y="116" font-family="'Segoe UI',system-ui,sans-serif" font-size="24" fill="#e6e6f0">The AI proposes. <tspan font-weight="700" fill="#f59e0b">You execute.</tspan></text>
    <text x="0" y="146" font-family="'Segoe UI',system-ui,sans-serif" font-size="20" fill="#9a9ab4">PostgreSQL &#183; MySQL &#183; SQL Server &#183; Firebird &#183; SQLite &#183; MongoDB &#183; Redis</text>
    <rect x="0" y="168" width="540" height="6" rx="3" fill="url(#accentBar)"/>
    <g font-family="Consolas,'JetBrains Mono',monospace" font-size="18" fill="#9a9ab4">
      <rect x="0" y="190" width="118" height="34" rx="17" fill="#15151f" stroke="#2a2a3d" stroke-width="1.5"/>
      <text x="16" y="213" fill="#e6e6f0">v0.1.0</text>
      <rect x="130" y="190" width="86" height="34" rx="17" fill="#15151f" stroke="#2a2a3d" stroke-width="1.5"/>
      <text x="146" y="213" fill="#e6e6f0">MIT</text>
      <rect x="228" y="190" width="158" height="34" rx="17" fill="#15151f" stroke="#2a2a3d" stroke-width="1.5"/>
      <text x="244" y="213" fill="#e6e6f0">Windows x64</text>
      <rect x="398" y="190" width="142" height="34" rx="17" fill="#15151f" stroke="#2a2a3d" stroke-width="1.5"/>
      <text x="412" y="213" fill="#e6e6f0">read-only</text>
    </g>
  </g>
  <g id="project-proof" transform="translate(704 44)">
    <rect x="0" y="0" width="440" height="272" rx="18" fill="#15151f" stroke="#2a2a3d" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="6" fill="#ff6767"/>
    <circle cx="48" cy="28" r="6" fill="#ffca85"/>
    <circle cx="68" cy="28" r="6" fill="#61ffca"/>
    <text x="92" y="34" font-family="Consolas,'JetBrains Mono',monospace" font-size="18" fill="#9a9ab4">query.sql &#8212; guarded</text>
    <rect x="20" y="52" width="400" height="128" rx="12" fill="#0f0f14" stroke="#2a2a3d" stroke-width="1"/>
    <g font-family="Consolas,'JetBrains Mono',monospace" font-size="20">
      <text x="40" y="86" fill="#a277ff">SELECT</text><text x="130" y="86" fill="#e6e6f0"> id, name</text>
      <text x="40" y="112" fill="#a277ff">FROM</text><text x="100" y="112" fill="#e6e6f0"> customers</text>
      <text x="40" y="138" fill="#a277ff">WHERE</text><text x="120" y="138" fill="#e6e6f0"> active = TRUE</text>
      <text x="40" y="164" fill="#5f5f88">-- runs only after human approval</text>
    </g>
    <g transform="translate(20 196)">
      <rect x="0" y="0" width="190" height="40" rx="20" fill="#1d1d2b" stroke="#a277ff" stroke-width="1.5"/>
      <text x="20" y="26" font-family="Consolas,'JetBrains Mono',monospace" font-size="18" fill="#a277ff">AI proposal</text>
      <text x="202" y="27" font-family="'Segoe UI',system-ui,sans-serif" font-size="22" fill="#5f5f88">&#8594;</text>
      <rect x="228" y="0" width="172" height="40" rx="20" fill="#f59e0b"/>
      <text x="246" y="26" font-family="Consolas,'JetBrains Mono',monospace" font-size="18" font-weight="700" fill="#0f0f14">YOU RUN IT</text>
    </g>
    <g transform="translate(330 52)">
      <rect x="0" y="0" width="90" height="30" rx="15" fill="#15151f" stroke="#61ffca" stroke-width="1.5"/>
      <text x="12" y="21" font-family="Consolas,'JetBrains Mono',monospace" font-size="16" fill="#61ffca">READ-ONLY</text>
    </g>
  </g>
</svg>
