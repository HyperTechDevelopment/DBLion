name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:safety
      - run: npm run test:security
      - run: npm run test:firebird
      - run: npm run test:firebird-catalog
      - run: npm run test:multi-db
      - run: npm run test:ai-data
      - run: npm run test:read-only
      - run: npm run build
